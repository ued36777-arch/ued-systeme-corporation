<!DOCTYPE html>
<html>
<head>
<title>U.E.D. SYSTEME & CORPORATION</title>

<style>
body {
    margin:0;
    background:black;
    color:white;
    overflow:hidden;
    font-family:monospace;
}

canvas {
    position:fixed;
    top:0;
    left:0;
}

.container {
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.blackhole {
    color:#777;
    font-size:22px;
    line-height:18px;
}

h1 {
    font-size:90px;
    letter-spacing:20px;
    margin:20px;
}

h2 {
    color:#aaa;
    letter-spacing:8px;
}
</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">

<div>

<div class="blackhole">

&nbsp;&nbsp;&nbsp;&nbsp;█████<br>
&nbsp;&nbsp;█████████<br>
&nbsp;███&nbsp;&nbsp;&nbsp;●&nbsp;&nbsp;&nbsp;███<br>
&nbsp;&nbsp;█████████<br>
&nbsp;&nbsp;&nbsp;&nbsp;█████

</div>

<h1>U.E.D.</h1>

<h2>SYSTEME & CORPORATION</h2>

</div>

</div>


<script>

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;


const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

const size = 18;

const columns = canvas.width / size;

const drops = [];

for(let i = 0; i < columns; i++){
    drops[i] = 0;
}


function draw(){

ctx.fillStyle = "rgba(0,0,0,0.08)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#555";
ctx.font=size+"px monospace";


for(let i=0;i<drops.length;i++){

let text = chars[Math.floor(Math.random()*chars.length)];

ctx.fillText(text,i*size,drops[i]*size);


drops[i]++;


if(drops[i]*size > canvas.height){
    drops[i]=0;
}

}

}


setInterval(draw,50);

</script>


</body>
</html>
